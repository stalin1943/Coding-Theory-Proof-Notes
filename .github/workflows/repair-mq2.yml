name: Repair Mq2 proof-note project

on:
  push:
    paths:
      - '.github/workflows/repair-mq2.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble LaTeX source
        shell: bash
        run: |
          cat abelian-automorphism-constant-two/.proof.tex.part* > abelian-automorphism-constant-two/proof.tex
          test -s abelian-automorphism-constant-two/proof.tex

      - name: Compile proof PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: proof.tex
          working_directory: abelian-automorphism-constant-two
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Validate and clean generated files
        shell: bash
        run: |
          test -s abelian-automorphism-constant-two/proof.pdf
          test "$(stat -c%s abelian-automorphism-constant-two/proof.pdf)" -gt 100000
          head -c 5 abelian-automorphism-constant-two/proof.pdf | grep -q '%PDF-'
          rm -f abelian-automorphism-constant-two/.proof.tex.part*
          rm -f abelian-automorphism-constant-two/proof.aux
          rm -f abelian-automorphism-constant-two/proof.fdb_latexmk
          rm -f abelian-automorphism-constant-two/proof.fls
          rm -f abelian-automorphism-constant-two/proof.log
          rm -f abelian-automorphism-constant-two/proof.out
          rm -f abelian-automorphism-constant-two/proof.synctex.gz
          rm -f .github/workflows/repair-mq2.yml

      - name: Commit repaired project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- abelian-automorphism-constant-two .github/workflows/repair-mq2.yml
          git commit -m "Repair M_q=2 PDF and complete project files"
          git push
